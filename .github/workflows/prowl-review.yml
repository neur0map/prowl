name: prowl review

# Prowl reviews every pull request: it indexes the changed tree and runs doctor,
# uploading SARIF so GitHub code scanning surfaces only the issues this PR
# introduces, inline on the diff. This workflow dogfoods Prowl on its own repo;
# copy it (and the composite action) into any project after `prowl init`.

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build prowl
        run: CGO_ENABLED=1 go build -tags sqlite_fts5 -o "$HOME/.local/bin/prowl" ./cmd/prowl
      - name: Add prowl to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Prowl review
        id: prowl
        uses: ./.github/actions/prowl-review
        with:
          fail-on: error
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.prowl.outputs.sarif }}
          category: prowl
