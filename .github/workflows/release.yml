name: build-binary

# Versioning standard (see docs/VERSIONING.md):
#
#   every push to unstable  -> patch bump (0.0.x), build, publish the PREVIEW channel
#   every push to main      -> build, publish vX.Y.Z and the STABLE channel
#   ten patches roll over   -> 0.9.9 becomes 0.10.0, patch resets to 0
#
# Bump, build and publish are one workflow on purpose. Splitting them cannot work
# here: a bump pushed with GITHUB_TOKEN does not trigger another workflow, and a
# "[skip ci]" bump sitting at the head of a merge suppresses the release run
# entirely (which is exactly how a stable release was silently skipped once).
on:
  push:
    branches: [main, unstable]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. v0.8.8 (blank = derive from the branch)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # version owns the single source of truth: var version in cmd/prowl/main.go.
  # unstable advances it and pushes the bump; main publishes whatever unstable
  # already produced, so a merge never renumbers itself.
  version:
    runs-on: ubuntu-latest
    # Skip only the bot's own bump on unstable, so the bump does not bump itself.
    # Keyed on the author, not on a marker in the message: matching message text
    # also matches any commit that merely mentions the marker, and on main it
    # would skip a merge whose tip happens to be a bump.
    if: >-
      github.event_name != 'push' ||
      github.ref_name != 'unstable' ||
      github.event.head_commit.author.name != 'github-actions[bot]'
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve version and channel
        id: resolve
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          file=cmd/prowl/main.go
          current=$(grep -oP 'var version = "v\K[0-9]+\.[0-9]+\.[0-9]+' "$file")
          if [ -z "$current" ]; then
            echo "could not read the current version from $file" >&2
            exit 1
          fi

          channel=none
          publish=false
          case "${{ github.ref_name }}" in
            unstable) channel=preview; publish=true ;;
            main)     channel=stable;  publish=true ;;
          esac
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            publish=false
          fi

          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
          elif [ "$channel" = "preview" ] && [ "${{ github.event_name }}" = "push" ]; then
            # Patch is single digit: the tenth bump rolls into the minor and
            # resets patch. Major stays manual.
            major=${current%%.*}; rest=${current#*.}
            minor=${rest%%.*};    patch=${rest##*.}
            patch=$((patch + 1))
            if [ "$patch" -ge 10 ]; then minor=$((minor + 1)); patch=0; fi
            version="${major}.${minor}.${patch}"
          else
            version="$current"
          fi

          echo "version=v${version}" >> "$GITHUB_OUTPUT"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "resolved v${version} on ${{ github.ref_name }} (channel=${channel}, publish=${publish})"

      - name: Commit the bump
        id: commit
        if: steps.resolve.outputs.channel == 'preview' && github.event_name == 'push'
        run: |
          set -euo pipefail
          want="${{ steps.resolve.outputs.version }}"
          sed -i "s/var version = \"v[0-9]\+\.[0-9]\+\.[0-9]\+\"/var version = \"${want}\"/" cmd/prowl/main.go
          if git diff --quiet; then
            echo "version already ${want}"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/prowl/main.go
            git commit -m "chore: bump version to ${want} (automated)"
            git push origin HEAD:unstable
          fi

  build-unix:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-amd64
            output: prowl-linux-amd64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            output: prowl-linux-arm64
          - runner: macos-14
            target: darwin-arm64
            output: prowl-darwin-arm64
          # darwin-amd64 has no Intel macOS runner that reliably schedules, so
          # it is cross-built on the arm64 runner (the macOS SDK is universal)
          # and not executed here.
          - runner: macos-14
            target: darwin-amd64
            output: prowl-darwin-amd64
            goarch: amd64
            cross: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and smoke
        shell: bash
        env:
          CGO_ENABLED: "1"
          OUTPUT: ${{ matrix.output }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          arch="${{ matrix.goarch }}"
          [ -n "$arch" ] && export GOARCH="$arch"
          commit=$(git rev-parse HEAD)
          go build -tags sqlite_fts5 -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${commit}" \
            -o "$OUTPUT" ./cmd/prowl
          shasum -a 256 "$OUTPUT" > "$OUTPUT.sha256"
          # Compatibility asset: installs released under the old prowl-agent name
          # self-update by a fixed filename. Publish a byte-identical copy (and its
          # checksum) under that name so those installs keep resolving through the
          # GitHub repo-rename redirect. The canonical prowl-* asset stays primary.
          compat="prowl-agent-${OUTPUT#prowl-}"
          cp "$OUTPUT" "$compat"
          shasum -a 256 "$compat" > "$compat.sha256"
          cmp -s "$OUTPUT" "$compat" || { echo "compat asset $compat drifted from $OUTPUT" >&2; exit 1; }
          echo "COMPAT=$compat" >> "$GITHUB_ENV"
          if [ -z "${{ matrix.cross }}" ]; then
            "./$OUTPUT" --version
            # The published binary must report the semantic version, not a commit
            # description: the update channel and the changelog are keyed to it.
            "./$OUTPUT" --version | grep -q "${VERSION}"
            # End to end: -X main.commit reaches internal/version.Commit and is
            # surfaced by --version. A local build leaves it empty.
            "./$OUTPUT" --version | grep -q "${commit}"
            scripts/release-smoke.sh "$OUTPUT" "$OUTPUT.sha256"
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ matrix.output }}
            ${{ matrix.output }}.sha256
            ${{ env.COMPAT }}
            ${{ env.COMPAT }}.sha256

  build-windows:
    name: windows-amd64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # sqlite-vec's C includes <sqlite3.h>, which mingw lacks. Install the
      # vcpkg header only (CGO_CFLAGS); go-sqlite3 still self-compiles its
      # bundled amalgamation via the sqlite_fts5 tag, so no lib is linked.
      - name: Provide sqlite3 headers for sqlite-vec
        shell: pwsh
        run: |
          & C:\vcpkg\vcpkg.exe install "sqlite3[fts5]:x64-mingw-static"
          "CGO_CFLAGS=-IC:\vcpkg\installed\x64-mingw-static\include" >> $env:GITHUB_ENV
      - name: Build and smoke
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          OUTPUT: prowl-windows-amd64.exe
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $commit = (git rev-parse HEAD | Out-String).Trim()
          go build -tags sqlite_fts5 -trimpath `
            -ldflags "-X main.version=$env:VERSION -X main.commit=$commit" `
            -o $env:OUTPUT ./cmd/prowl
          $vout = & (Join-Path $PWD $env:OUTPUT) --version | Out-String
          if ($vout -notmatch [regex]::Escape($env:VERSION)) { Write-Error "version missing from --version output"; exit 1 }
          # End to end: -X main.commit reaches internal/version.Commit and is surfaced by --version.
          if ($vout -notmatch [regex]::Escape($commit)) { Write-Error "stamped commit missing from --version output"; exit 1 }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:OUTPUT).Hash.ToLowerInvariant()
          "$hash  $($env:OUTPUT)" | Set-Content -LiteralPath "$($env:OUTPUT).sha256" -NoNewline -Encoding ascii
          & ./scripts/release-smoke.ps1 -Binary $env:OUTPUT -Checksum "$($env:OUTPUT).sha256"
          # Compatibility asset under the old prowl-agent name: a byte-identical
          # copy (and its checksum) so an install released under that filename
          # keeps resolving through the GitHub repo-rename redirect.
          $compat = "prowl-agent-" + ($env:OUTPUT -replace '^prowl-','')
          Copy-Item -LiteralPath $env:OUTPUT -Destination $compat
          $chash = (Get-FileHash -Algorithm SHA256 -LiteralPath $compat).Hash.ToLowerInvariant()
          "$chash  $compat" | Set-Content -LiteralPath "$compat.sha256" -NoNewline -Encoding ascii
          if ($chash -ne $hash) { Write-Error "compat asset $compat drifted from $($env:OUTPUT)"; exit 1 }
          "COMPAT=$compat" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          if-no-files-found: error
          path: |
            prowl-windows-amd64.exe
            prowl-windows-amd64.exe.sha256
            ${{ env.COMPAT }}
            ${{ env.COMPAT }}.sha256

  # Preview: every unstable commit, as it lands. Opt in with
  # PROWL_UPDATE_CHANNEL=preview; nothing here reaches a default install.
  publish-preview:
    needs: [version, build-unix, build-windows]
    if: needs.version.outputs.publish == 'true' && needs.version.outputs.channel == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: Preview ${{ needs.version.outputs.version }} (latest unstable)
          prerelease: true
          make_latest: false
          files: release/**/*
          body: >
            Preview build of prowl ${{ needs.version.outputs.version }} from
            the latest unstable commit (${{ github.sha }}). Unreviewed: every
            commit is published here as it lands. Opt in with
            PROWL_UPDATE_CHANNEL=preview. Verify every binary with its included
            SHA-256 file.

  # Stable: what a default install receives. vX.Y.Z is the permanent record,
  # `stable` is the rolling tag the updater downloads, and `nightly` is the
  # retired name kept fed so binaries released before the channel split keep
  # updating. Every tag also carries byte-identical prowl-agent-* copies so
  # installs released under the old name still resolve on the rename redirect.
  publish-stable:
    needs: [version, build-unix, build-windows]
    if: needs.version.outputs.publish == 'true' && needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release

      - name: Publish the versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          prerelease: false
          make_latest: true
          files: release/**/*
          body: >
            Cross-platform build of prowl ${{ needs.version.outputs.version }}.
            Assets under the old prowl-agent name are byte-identical
            compatibility copies for installs that self-update by that filename;
            new installs use the canonical prowl-* assets. Verify every binary
            with its included SHA-256 file.

      - name: Refresh the rolling stable channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable
          name: Stable ${{ needs.version.outputs.version }} (latest main)
          prerelease: false
          make_latest: false
          files: release/**/*
          body: >
            Rolling stable channel, currently prowl
            ${{ needs.version.outputs.version }}. This is what `prowl update`
            downloads by default. Verify every binary with its included SHA-256 file.

      - name: Refresh the retired nightly alias
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Stable ${{ needs.version.outputs.version }} (retired nightly alias)
          prerelease: true
          make_latest: false
          files: release/**/*
          body: >
            Retired tag, kept in step with the stable channel so binaries released
            before the stable/preview split keep updating. New installs follow
            `stable`. Verify every binary with its included SHA-256 file.
